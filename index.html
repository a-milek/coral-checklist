<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Coral Island Checklist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: lagoon header with altar tabs, then a grid of offering "baskets", each a checklist of items */
:root{
  --bg:#eef5f3; --surface:#ffffff; --surface-2:#e2eeeb; --line:#cddfda;
  --fg:#16332f; --muted:#5b7772; --lagoon:#0e7c74; --lagoon-ink:#ffffff;
  --coral:#e2574c; --done:#2f9e5b; --done-bg:#e3f4e9;
  --q-bronze:#a8682f; --q-silver:#7d8a96; --q-gold:#c79a12; --q-osmium:#7b5cc4;
  --f-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1d1c; --surface:#122927; --surface-2:#183533; --line:#24443f;
  --fg:#dcefeb; --muted:#8fb0aa; --lagoon:#1aa79b; --lagoon-ink:#04201d;
  --coral:#ff7b6e; --done:#4cc782; --done-bg:#16382a;
  --q-bronze:#d99556; --q-silver:#b4c0cb; --q-gold:#e8c14a; --q-osmium:#a98cf0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1d1c; --surface:#122927; --surface-2:#183533; --line:#24443f;
  --fg:#dcefeb; --muted:#8fb0aa; --lagoon:#1aa79b; --lagoon-ink:#04201d;
  --coral:#ff7b6e; --done:#4cc782; --done-bg:#16382a;
  --q-bronze:#d99556; --q-silver:#b4c0cb; --q-gold:#e8c14a; --q-osmium:#a98cf0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:22px 6px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--lagoon)}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--done);box-shadow:0 0 0 3px color-mix(in srgb,var(--done) 25%,transparent)}
.dot.err{background:var(--coral)}
.temple{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--lagoon);border-radius:inherit;transition:width .3s}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f-body);padding:8px 14px;border-radius:99px;cursor:pointer;text-decoration:none}
.tab small{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.tab[aria-current="page"]{background:var(--lagoon);border-color:var(--lagoon);color:var(--lagoon-ink)}
.tab[aria-current="page"] small{color:inherit;opacity:.85}
.tab.complete small{color:var(--done)}
.late-toggle{border-style:dashed;background:none;color:var(--muted)}
.tab[aria-current="page"].complete small{color:inherit}
.tab:focus-visible,.item:focus-within,button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
main{padding-block:18px 48px}
.altar-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
.altar-head h2{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0}
.altar-head p{margin:0;color:var(--muted);font-size:14px}
.grid{display:flex;gap:14px;align-items:flex-start}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.offer{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.offer.kind-temple{--kind:var(--sp)}
.offer.kind-museum{--kind:var(--lagoon)}
.offer[class*="kind-"]{border-top:4px solid var(--kind)}
.offer[class*="kind-"] .offer-head{background:color-mix(in srgb,var(--kind) 12%,transparent);margin-bottom:4px}
.offer[class*="kind-"] h3{color:color-mix(in srgb,var(--kind) 70%,var(--fg))}
.offer.done{border-color:color-mix(in srgb,var(--done) 55%,var(--line));opacity:.55;transition:opacity .15s}
.offer.done:hover,.offer.done:focus-within{opacity:1}
.offer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 10px}
.offer-head h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;line-height:1.15;min-width:0}
.need{font-size:12px;color:var(--muted);margin-top:2px;font-weight:600}
.count{flex:none;font:700 13px var(--f-body);font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.offer.done .count{background:var(--done-bg);color:var(--done)}
ul{list-style:none;margin:0;padding:0 6px 6px}
.item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer;user-select:none}
.item:hover{background:var(--surface-2)}
.item input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface);transition:background .15s,border-color .15s}
.box svg{width:13px;height:13px;stroke:var(--surface);stroke-width:3.2;fill:none;opacity:0}
.item input:checked + .box{background:var(--done);border-color:var(--done)}
.item input:checked + .box svg{opacity:1}
.name{flex:1;min-width:0;font-weight:600}
.item input:checked ~ .name{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.qty{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:13px}
.q{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:99px;border:1.5px solid currentColor}
.q.bronze{color:var(--q-bronze)}.q.silver{color:var(--q-silver)}.q.gold{color:var(--q-gold)}.q.osmium{color:var(--q-osmium)}
.icon{flex:none;width:28px;height:28px;object-fit:contain}
.item input:checked ~ .icon,.ticked .icon{opacity:.55}
.hurry{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--coral);line-height:1.3}
.name-btn .nm{display:block}
.ticked .hurry,.item input:checked ~ .name .hurry{opacity:.5}
.who{flex:none;width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
.reward{border-top:1px dashed var(--line);padding:8px 14px 10px;font-size:13px;color:var(--muted)}
.reward b{color:var(--fg);font-weight:700}
.note{margin-top:22px;font-size:13px;color:var(--muted);max-width:68ch}
.note a{color:var(--lagoon)}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--surface-2);color:var(--fg);font-size:14px}
.reset{background:none;border:1px solid var(--line);color:var(--muted);font:600 13px var(--f-body);padding:6px 12px;border-radius:99px;cursor:pointer}
.reset.arm{border-color:var(--coral);color:var(--coral)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:root{--sp:#3f9e4d;--su:#c49a12;--fa:#d0702a;--wi:#3d8bd1}
.modes{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;width:max-content;max-width:100%}
.mode{border:0;background:none;color:var(--muted);font:700 14px var(--f-body);padding:8px 16px;border-radius:9px;cursor:pointer;text-decoration:none}
.mode[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 15%,transparent)}
.progress{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 24px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:14px}
.search{flex:1 1 200px;min-width:0;max-width:340px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f-body);padding:8px 12px;border-radius:10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 13px var(--f-body);padding:6px 11px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.mlist.fishes{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.mrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px}
.mrow.got{background:color-mix(in srgb,var(--done-bg) 60%,var(--surface))}
.finfo{padding:0 10px 9px 42px;font-size:13px;color:var(--muted);display:grid;gap:3px}
.finfo b{color:var(--fg);font-weight:700}
.finfo .tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:1px}
.sea{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:99px;border:1.5px solid currentColor}
.sea.s{color:var(--sp)}.sea.u{color:var(--su)}.sea.f{color:var(--fa)}.sea.w{color:var(--wi)}
.sea.x{color:var(--muted)}
.rar{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rar.Rare{color:var(--wi)}.rar.Legendary{color:var(--q-osmium)}
.src{font-size:11px;font-style:italic}
.offer .finfo{padding:0 8px 6px 40px;font-size:12px}
.item.has-info{cursor:default}
.tick{display:grid;place-items:center;cursor:pointer;margin:-4px;padding:4px}
.name-btn{background:none;border:0;padding:2px 0;margin:0;font:inherit;font-weight:600;color:var(--fg);text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px}
.name-btn:hover{color:var(--lagoon)}
.chev{font-size:11px;color:var(--muted)}
.ticked .name-btn{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.rar.SuperRare{color:var(--fa)}
.drops{display:grid;gap:2px;font-variant-numeric:tabular-nums}
.drop{display:flex;justify-content:space-between;gap:12px}
.empty{color:var(--muted);padding:24px 4px}
@media (max-width:420px){.mlist.fishes{grid-template-columns:1fr}}
</style>
<style>
.roombar{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:13px;color:var(--muted)}
.roombar input{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--f-body);padding:6px 10px;border-radius:9px;width:150px}
.roombar button{border:1px solid var(--lagoon);background:var(--lagoon);color:var(--lagoon-ink);font:700 13px var(--f-body);padding:7px 12px;border-radius:99px;cursor:pointer}
.roombar .linkbox{flex:1 1 260px;min-width:0;border:1px dashed var(--line);border-radius:9px;padding:6px 10px;font:12px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere;color:var(--fg);background:var(--surface)}
</style>
</head><body>


<header class="wrap">
  <div class="top">
    <div>
      <h1>Coral Island <span>Checklist</span></h1>
      <p class="sub">Shared with everyone on this page. Ticks sync live.</p>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
  </div>
  <div class="progress">
    <div class="temple"><span id="templeText">Temple 0 / 0</span><div class="bar"><i id="templeBar" style="width:0"></i></div></div>
    <div class="temple"><span id="museumText">Museum 0 / 0</span><div class="bar"><i id="museumBar" style="width:0"></i></div></div>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="roombar" id="roombar">
    <label for="nick">Your name</label>
    <input id="nick" maxlength="20" autocomplete="nickname" placeholder="e.g. WM">
    <button id="copyLink" type="button">Copy invite link</button>
    <span id="copied" hidden>Copied. Send it to your friend.</span>
    <div class="linkbox" id="linkbox"></div>
  </div>
</header>
<nav><div class="wrap" style="display:grid;gap:10px">
  <div class="modes" id="modes"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
</div></nav>
<main class="wrap">
  <div class="altar-head"><h2 id="altarTitle"></h2><p id="altarSub"></p><span style="flex:1"></span><button class="reset" id="resetBtn" type="button">Clear this altar</button></div>
  <div class="toolbar" id="toolbar" hidden>
    <input class="search" id="search" type="search" placeholder="Search this collection" autocomplete="off">
    <span id="seasonChips" style="display:contents"></span>
    <button class="chip" id="hideGot" type="button" aria-pressed="false">Hide donated</button>
  </div>
  <div id="grid"></div>
  <p class="note" id="note"></p>
</main>

function seasonGroups(sid){
  const groups = [];
  activeAltars().forEach(a => {
    const rows = [];
    a.offers.forEach(o => {
      const full = offerDone(a, o);
      o.items.forEach(([name, qty=1, q], i) => {
        const key = keyOf(a, o, i);
        if (!itemSeasons(name).includes(sid) || (full && !checks[key])) return; // offer already complete without it
        rows.push({key, name, qty, q, s: itemSeasons(name), info: INFO_BY_NAME[normName(name)], icon: templeIcon(name)});
      });
    });
    groups.push({title: a.name, kind: "temple", rows});
  });
  [["fish","Fish"],["insects","Insects"],["critters","Sea Critters"]].forEach(([id, title]) => {
    const c = MUSEUM.find(m => m.id === id);
    const rows = c.items.filter(raw => ((INFO[id][raw] || {}).s || "").includes(sid))
      .map(raw => ({key: mKey(c, raw), name: prettify(raw), s: INFO[id][raw].s, info: INFO[id][raw], icon: iconPath(raw)}));
    groups.push({title: "Museum: " + title, kind: "museum", rows});
  });
  // last chance = not in any later season this year (in Winter: not in next Spring either, since it runs straight on)
  const i = SEASONS.findIndex(([c]) => c === sid);
  const later = SEASONS.slice(i + 1).map(([c]) => c).join("") || SEASONS[0][0];
  groups.forEach(g => g.rows.forEach(r => { r.done = !!checks[r.key]; r.last = ![...later].some(c => r.s.includes(c)); r.only = r.s === sid; }));
  return groups.filter(g => g.rows.length);
}
const seasonLeft = sid => seasonGroups(sid).reduce((n, g) => n + g.rows.filter(r => !r.done).length, 0);

function route(){
  const h = location.hash.slice(1);

  if (h.startsWith("museum-")){ const c = MUSEUM.find(c => "museum-" + c.id === h); if (c) return {mode:"museum", cur:c}; }

}

function fishDetails(info){
  const box = el("div","finfo");

  } else tags.append(el("span","sea x","Season not listed"));
  if (info.rarity) tags.append(el("span","rar " + info.rarity.replace(/\s/g,""), info.rarity));

  const line = (label, val) => { if (!val) return; const d = el("div"); const b = el("b", null, label + ": "); d.append(b, val); box.append(d); };

}

  let tDone = 0, tAll = 0; activeAltars().forEach(a => { tAll += a.offers.length; tDone += a.offers.filter(o=>offerDone(a,o)).length; });
  let mDone = 0, mAll = 0; MUSEUM.forEach(c => { mAll += c.items.length; mDone += mGot(c); });
  $("templeText").textContent = `Temple ${tDone} / ${tAll} offerings`; $("templeBar").style.width = tDone/tAll*100 + "%";
  $("museumText").textContent = `Museum ${mDone} / ${mAll} donated`; $("museumBar").style.width = mDone/mAll*100 + "%";
  // mode switch
  const modes = $("modes"); modes.textContent = "";
  [["temple","Temple offerings","#" + ALTARS[0].id],["museum","Museum","#museum-" + MUSEUM[0].id],["season","This season","#season-" + lastSeason]].forEach(([m,label,href]) => {
    const a = el("a","mode",label); a.href = href; if (m === mode) a.setAttribute("aria-current","page"); modes.append(a);
  });
  // tabs
  const tabs = $("tabs"); tabs.textContent = "";
  if (mode === "season"){
    SEASON_TABS.forEach(s => {
      const left = seasonLeft(s.id);
      const t = el("a","tab" + (left ? "" : " complete")); t.href = "#season-" + s.id; t.setAttribute("role","tab");
      if (s === cur) t.setAttribute("aria-current","page");
      t.append(s.name, el("small", null, left ? `${left} left` : "done"));
      tabs.append(t);
    });
  } else (mode === "temple" ? activeAltars() : MUSEUM).forEach(x => {
    const total = mode === "temple" ? x.offers.length : x.items.length;
    const d = mode === "temple" ? x.offers.filter(o=>offerDone(x,o)).length : mGot(x);
    const t = el("a","tab" + (d === total ? " complete" : ""));
    t.href = "#" + (mode === "temple" ? x.id : "museum-" + x.id); t.setAttribute("role","tab");
    if (x === cur) t.setAttribute("aria-current","page");
    t.append(mode === "temple" ? x.name.replace(" Altar","") : x.name, el("small", null, `${d}/${total}`));
    tabs.append(t);
  });
  if (mode !== "museum"){
    const late = ALTARS.filter(a => a.late).map(a => a.name.replace(" Altar","")).join(" and ");
    const b = el("button","tab late-toggle", showLate ? "Hide late game" : "Late game: " + late);
    b.type = "button"; b.setAttribute("aria-pressed", String(showLate));
    b.title = showLate ? `Hide the ${late} altars again` : `Show the ${late} altars (unlocked later in the game)`;
    b.addEventListener("click", () => {
      showLate = !showLate; try { localStorage.setItem("ci-late", showLate ? "1" : "0"); } catch(e){}
      if (!showLate && ALTARS.some(a => a.late && location.hash === "#" + a.id)) location.hash = ALTARS[0].id; else render();
    });
    tabs.append(b);
  }

  const ids = [...new Set(Object.values(checks).map(c=>c.by).filter(Boolean))];
  if (user && ids.length){ try { profiles = await user.profiles(ids); } catch(e){} }

  // Build off-page and swap in at once: emptying the live grid first would let the page shrink
  // for a moment (colCount measures it), and the browser then pulls the scroll position up.
  const grid = $("grid"), next = document.createElement("div");
  $("resetBtn").hidden = !canWrite;
  if (mode === "temple") renderTemple(cur, next); else if (mode === "season") renderSeason(cur, next); else renderMuseum(cur, next);
  grid.className = next.className; grid.replaceChildren(...next.childNodes);
}

function renderSeason(cur, grid){
  lastSeason = cur.id; try { localStorage.setItem("ci-season", cur.id); } catch(e){}
  const groups = seasonGroups(cur.id);
  const left = groups.reduce((n, g) => n + g.rows.filter(r => !r.done).length, 0);
  $("toolbar").hidden = false; $("seasonChips").textContent = "";
  $("hideGot").textContent = "Hide done"; $("hideGot").setAttribute("aria-pressed", String(filt.hideGot));
  $("resetBtn").hidden = true;
  $("altarTitle").textContent = cur.name;
  $("altarSub").textContent = left ? `${left} still needed this season` : "Everything for this season is done";
  $("note").innerHTML = 'Fish, insects and sea critters that spawn this season, and the seasonal items temple offerings still need. "Last chance" items do not come back later this year, so get them first; "Only" means this is their only season. Ticks here are the same ticks as on the Temple and Museum pages. Some fish only appear on certain days; tap a name to see when and where. Data from <a href="https://coral.guide/" target="_blank" rel="noopener">Coral Guide</a> (game version v1.3).';
  grid.className = "grid";
  const q = filt.q.trim().toLowerCase();
  const cards = [];
  for (const g of groups){
    const gLeft = g.rows.filter(r => !r.done).length;
    if (!gLeft) continue; // finished cards are hidden
    const rows = g.rows.filter(r => (!q || r.name.toLowerCase().includes(q)) && !(filt.hideGot && r.done))
      .sort((a, b) => b.last - a.last || b.only - a.only); // ignores ticks so rows stay put when clicked
    if (!rows.length) continue;
    const card = el("section","offer kind-" + g.kind);
    const head = el("div","offer-head"); const hl = el("div"); hl.style.minWidth = "0";
    const gLast = g.rows.filter(r => !r.done && r.last).length;
    hl.append(el("h3", null, g.title), el("div","need", `${gLeft} still needed` + (gLast ? ` · ${gLast} last chance` : "")));
    head.append(hl, el("span","count", `${g.rows.length - gLeft} / ${g.rows.length}`)); card.append(head);
    const ul = el("ul");
    rows.forEach(r => {
      const extras = [];
      if (r.q) extras.push(el("span","q " + QN[r.q], QN[r.q]));
      if (r.qty > 1) extras.push(el("span","qty","×" + r.qty));
      let flag = null;
      if (r.last){
        flag = el("span","hurry", r.only ? "Only in " + cur.name : "Last chance this year");
        flag.title = r.only ? `Only available in ${cur.name}` : "Not available again later this year";
      }
      const li = el("li"); li.append(checkRow(r.key, r.name, extras, r.info, r.icon, flag));
      if (r.info && expanded.has(r.key)) li.append(details(r.info));
      ul.append(li);
    });
    card.append(ul); cards.push({el: card, weight: rows.length + 2});
  }
  masonry(grid, cards);
  const shown = cards.length;
  if (!shown) grid.append(el("p","empty", q ? "Nothing matches. Try another search." : "Everything for this season is done."));
}

function renderTemple(cur, grid){
  $("toolbar").hidden = true;
  $("altarTitle").textContent = cur.name;
  $("altarSub").textContent = cur.reward ? `Completing it: ${cur.reward}` : "";
  $("resetBtn").textContent = "Clear this altar";
  $("note").innerHTML = 'Offering data from <a href="https://coral.guide/my/offerings-checklist/cropaltar" target="_blank" rel="noopener">Coral Guide</a> (game version v1.3). "Any N" means only that many of the listed items are needed. Quality badges show the minimum quality.';
  grid.className = "grid";
  const cards = [];
  for (const o of cur.offers){
    const g = got(cur,o), n = need(o), done = g >= n;
    const card = el("section","offer" + (done ? " done" : ""));
    const head = el("div","offer-head"); const hl = el("div"); hl.style.minWidth = "0";
    hl.append(el("h3", null, o.t), el("div","need", o.need === -1 ? "All required" : `Any ${n} of ${o.items.length}`));
    head.append(hl, el("span","count", done ? "Completed ✓" : `${Math.min(g,n)} / ${n}`)); card.append(head);
    const ul = el("ul");
    o.items.forEach(([name, qty=1, q], i) => {
      const extras = [];
      if (q) extras.push(el("span","q " + QN[q], QN[q]));
      if (qty > 1) extras.push(el("span","qty","×" + qty));
      const k = keyOf(cur,o,i), fi = INFO_BY_NAME[normName(name)];
      const li = el("li"); li.append(checkRow(k, name, extras, fi, templeIcon(name)));
      if (fi && expanded.has(k)) li.append(details(fi));
      ul.append(li);
    });
    card.append(ul);
    if (o.reward){ const r = el("div","reward"); r.append("Reward: ", el("b", null, o.reward)); card.append(r); }
    cards.push({el: card, done, weight: o.items.length + 2 + (o.reward ? 1 : 0)});
  }
  if (!templeOrder || templeOrder.id !== cur.id)
    templeOrder = {id: cur.id, order: cards.map((c, i) => i).sort((a, b) => cards[a].done - cards[b].done)};
  masonry(grid, templeOrder.order.map(i => cards[i]));
}
// Completed offerings go last, but the order is only worked out when an altar is opened, so
// finishing one fades it in place instead of moving cards around while you tick.
let templeOrder = null;

// Cards go into fixed columns (shortest column first, by row count), so opening details or
// ticking an item only grows its own column instead of reshuffling cards between columns.
let gridCols = 0;
const colCount = () => Math.max(1, Math.floor(($("grid").clientWidth + 14) / (300 + 14)));
function masonry(grid, cards){
  const n = gridCols = colCount();
  const cols = Array.from({length: n}, () => el("div","mcol")), h = new Array(n).fill(0);
  cards.forEach(c => { const i = h.indexOf(Math.min(...h)); cols[i].append(c.el); h[i] += c.weight; });
  grid.append(...cols);
}
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (route().mode !== "museum" && colCount() !== gridCols) render(); }, 150); });

function renderMuseum(cur, grid){
  const isFish = cur.id === "fish", hasInfo = !!INFO[cur.id], seasonal = ["fish","insects","critters"].includes(cur.id);
  $("toolbar").hidden = false;
  $("altarTitle").textContent = cur.name;
  $("altarSub").textContent = `${mGot(cur)} of ${cur.items.length} donated`;
  $("resetBtn").textContent = "Clear this collection";
  $("note").innerHTML = !seasonal && hasInfo
    ? 'Tap a name to see where it comes from. Coffers and geodes are opened at the Blacksmith and fossil nodes at the Lab; the percentage is the chance per item opened. Data from <a href="https://coral.guide/" target="_blank" rel="noopener">Coral Guide</a> (game version v1.3).'
    : hasInfo
    ? 'Tap a name to see where and when to find it. Museum list and spawn data from <a href="https://coral.guide/" target="_blank" rel="noopener">Coral Guide</a> (game version v1.3). For 11 fish, coral.guide has no place or time data, so those come from the <a href="https://coralisland.wiki/wiki/Fish" target="_blank" rel="noopener">Coral Island wiki</a>. Notes describe extra conditions, such as date windows or other places.'
    : 'Museum list from <a href="https://coral.guide/" target="_blank" rel="noopener">Coral Guide</a> (game version v1.3).';
  const chips = $("seasonChips"); chips.textContent = "";
  if (seasonal){
    [["","Any season"], ...SEASONS].forEach(([c,n]) => {
      const b = el("button","chip",n); b.type = "button"; b.setAttribute("aria-pressed", String(filt.season === c));
      b.addEventListener("click", () => { filt.season = c; saveFilt(); render(); }); chips.append(b);
    });
  }
  $("hideGot").textContent = "Hide donated"; $("hideGot").setAttribute("aria-pressed", String(filt.hideGot));
  grid.className = "mlist" + (hasInfo ? " fishes" : "");
  const q = filt.q.trim().toLowerCase();
  let shown = 0;
  cur.items.forEach(raw => {
    const name = prettify(raw), key = mKey(cur, raw), have = !!checks[key];
    if (q && !name.toLowerCase().includes(q)) return;
    if (filt.hideGot && have) return;
    const fi = hasInfo ? INFO[cur.id][raw] : null;
    if (seasonal && filt.season && fi && fi.s && !fi.s.includes(filt.season)) return;
    const row = el("div","mrow" + (have ? " got" : ""));
    row.append(checkRow(key, name, null, fi, iconPath(raw)));
    if (fi && expanded.has(key)) row.append(details(fi));
    grid.append(row); shown++;
  });
  if (!shown) grid.append(el("p","empty", filt.hideGot && !q ? "Everything here is donated." : "Nothing matches. Try another search or season."));
}

async function toggle(k, on){
  if (on) checks[k] = {by:myId}; else delete checks[k];
  render();
  if (!db) return;
  try {
    const ref = db.collection("checks").doc(k);
    if (on) await ref.set({by: myId, at: Date.now()}); else await ref.delete();
  } catch(e){
    if (e && e.code === "invalid_argument"){ canWrite = false; showBanner("You can view this checklist but not change it. Reload the page and try again."); render(); }
    else showBanner("That change didn't save. Check your connection and tick it again.");
  }
}
function showBanner(t){ const b = $("banner"); b.textContent = t; b.hidden = false; }

let qTimer = null;
$("search").addEventListener("input", e => { filt.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(render, 120); });
$("hideGot").addEventListener("click", () => { filt.hideGot = !filt.hideGot; saveFilt(); render(); });

let armed = null;
$("resetBtn").addEventListener("click", async () => {
  const btn = $("resetBtn"), {mode, cur} = route();
  const label = btn.textContent;
  if (!btn.classList.contains("arm")){
    btn.classList.add("arm"); btn.dataset.label = label; btn.textContent = `Tap again to clear ${cur.name}`;
    clearTimeout(armed); armed = setTimeout(()=>{ btn.classList.remove("arm"); btn.textContent = btn.dataset.label; }, 3500);
    return;
  }
  clearTimeout(armed); btn.classList.remove("arm");
  const prefix = mode === "temple" ? cur.id + "~" : `museum~${cur.id}~`;
  const keys = Object.keys(checks).filter(k => k.startsWith(prefix));
  keys.forEach(k => delete checks[k]); templeOrder = null; render();
  if (db) for (const k of keys){ try { await db.collection("checks").doc(k).delete(); } catch(e){} }
});

window.addEventListener("hashchange", () => { templeOrder = null; filt.q = ""; $("search").value = ""; render(); window.scrollTo(0,0); });
render();

// ---- Sync through Firebase Realtime Database ----
function initial(name){ return (name || "?").trim().charAt(0).toUpperCase() || "?"; }
function hue(name){ let h = 0; for (const ch of name || "") h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function avatarFor(name){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="hsl(${hue(name)},55%,45%)"/><text x="12" y="16.5" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">${initial(name).replace(/[<&>]/g,"")}</text></svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}
(function(){
  const params = new URLSearchParams(location.search);
  let room = params.get("room");
  if (!room || !/^[A-Za-z0-9]{8,40}$/.test(room)){
    const abc = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    room = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => abc[b % abc.length]).join("");
    params.set("room", room);
    history.replaceState(null, "", location.pathname + "?" + params.toString() + location.hash);
  }
  const inviteUrl = () => location.origin + location.pathname + "?room=" + room;
  $("linkbox").textContent = inviteUrl();
  $("copyLink").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(inviteUrl()); $("copied").hidden = false; setTimeout(() => $("copied").hidden = true, 2500); }
    catch(e){ const r = document.createRange(); r.selectNodeContents($("linkbox")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
  });

  let nick = ""; try { nick = localStorage.getItem("ci-nick") || ""; } catch(e){}
  $("nick").value = nick;
  myId = nick || "Player";
  $("nick").addEventListener("change", e => { nick = e.target.value.trim().slice(0,20); myId = nick || "Player"; try { localStorage.setItem("ci-nick", nick); } catch(err){} render(); });

  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.databaseURL || /PASTE/.test(cfg.databaseURL)){
    setStatus("err", "Not syncing: add your Firebase settings to firebase-config.js");
    return;
  }
  firebase.initializeApp(cfg);
  const ref = firebase.database().ref("rooms/" + room + "/checks");
  db = { collection: () => ({ doc: k => ({
    set: v => ref.child(k).set(v),
    delete: () => ref.child(k).remove(),
  }) }) };
  firebase.database().ref(".info/connected").on("value", s => { if (s.val() === false && Object.keys(checks).length) setStatus("err", "Offline. Changes will sync when you reconnect."); });
  let firstSync = true;
  ref.on("value", snap => {
    checks = snap.val() || {};
    if (firstSync){ firstSync = false; templeOrder = null; } // the page first renders before any ticks have loaded
    profiles = {};
    for (const c of Object.values(checks)) if (c && c.by && !profiles[c.by]) profiles[c.by] = {name: c.by, avatarUrl: avatarFor(c.by), isMe: c.by === myId};
    setStatus("live", "Synced live");
    render();
  }, () => setStatus("err", "Sync failed. Check the database rules in the setup guide."));
})();
</script>
</body></html>
